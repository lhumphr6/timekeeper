<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Import Another Department</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      .page-wide { max-width: 1200px; margin: 0 auto; }
      .panel { background: #f5f5f5; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
      .panel-title { font-size: 1.5em; font-weight: bold; margin-bottom: 15px; }
      .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      .label { font-weight: bold; }
      .select, .input { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; }
      .btn { padding: 8px 16px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; text-decoration: none; }
      .btn.primary { background: #007bff; color: white; border-color: #007bff; }
      .btn:hover { opacity: 0.8; }
      .checkbox { display: flex; gap: 6px; align-items: center; }
      .muted { color: #666; font-size: 0.9em; margin-top: 8px; }
    </style>
  </head>
  <body class="tk">
    <div class="page-wide">
      <div class="panel">
        <div class="panel-title">Import Another Department</div>
        <form method="post" action="/import/department/upload" enctype="multipart/form-data" class="panel toolbar" style="gap:12px; flex-wrap:wrap; align-items:center;">
          <label class="label">Time Period</label>
          <select class="select" name="timesheet_id" required>
            {% for p in period_options %}
              <option value="{{ p.timesheet_id }}" {% if active_ts == p.timesheet_id %}selected{% endif %}>{{ p.display }}</option>
            {% endfor %}
          </select>
          <label class="label">File</label>
          <input class="input" type="file" name="file" accept=".csv,.xlsx,.xlsm,.txt" required>
          <label class="checkbox" style="display:flex; gap:6px; align-items:center;">
            <input type="checkbox" name="restrict_to_period" value="1" checked> Only import rows within this time period's date range
          </label>
          <button class="btn primary" type="submit">Upload</button>
        </form>
        <div class="muted" style="margin-top:8px;">Supported files: CSV, XLSX. Expected columns include Employee Name, Date, Clock In, Clock Out, Break Hours, PTO Hours, PTO Type. We'll normalize whatever headers you have.</div>
      </div>
    </div>
  </body>
</html>
